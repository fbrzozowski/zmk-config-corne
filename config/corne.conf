# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
CONFIG_ZMK_DISPLAY=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

# --- Fix BLE lag ---
CONFIG_BT_GAP_MIN_CONN_INTERVAL=6
CONFIG_BT_GAP_MAX_CONN_INTERVAL=12
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# --- Fix split keepalive jitter (causes repeats) ---
CONFIG_ZMK_SPLIT_BLE_KEEPALIVE_MS=20
CONFIG_ZMK_SPLIT_BLE_PERIPHERAL_LATENCY=0

# --- Fix key sluggishness / eliminate fake repeats ---
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=3
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=3